<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Rentshare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .search-wrap{ max-width:var(--max-width); margin:0 auto; padding:16px 20px 90px; }
  .top-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .back-btn{
    width:34px; height:34px; border-radius:10px; background:var(--surface);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    color:var(--ink); flex-shrink:0;
  }
  .search-bar{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:11px 14px; display:flex; align-items:center; gap:8px;
  }
  .search-bar input{
    border:none; outline:none; background:transparent; font-size:14px; width:100%; font-family:'Inter',sans-serif;
  }
  .filter-toggle{
    width:34px; height:34px; border-radius:10px; background:var(--surface);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    color:var(--ink); flex-shrink:0; position:relative;
  }
  .filter-toggle.active-dot::after{
    content:""; position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--coral);
  }

  .filters-panel{
    display:none; background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:16px;
  }
  .filters-panel.open{ display:block; }
  .filter-group{ margin-bottom:16px; }
  .filter-group:last-child{ margin-bottom:0; }
  .filter-label{ font-size:12px; font-weight:600; color:var(--muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:.03em; }
  .chip-select{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip-opt{
    font-size:12px; font-weight:600; padding:8px 13px; border-radius:20px;
    background:var(--screen-bg); border:1px solid var(--line); color:var(--muted); cursor:pointer;
  }
  .chip-opt.active{ background:#FDF1D9; border-color:var(--yellow); color:var(--yellow-text); }
  .price-row{ display:flex; gap:10px; align-items:center; }
  .price-row input{
    flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:13px; font-family:'Inter',sans-serif;
  }
  .filter-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn-apply, .btn-clear{
    flex:1; padding:12px; border-radius:12px; font-weight:700; font-size:13px; cursor:pointer;
    font-family:'Space Grotesk',sans-serif; border:none;
  }
  .btn-apply{ background:var(--yellow); color:#161006; }
  .btn-clear{ background:transparent; border:1px solid var(--line); color:var(--muted); }

  .result-count{ font-size:12.5px; color:var(--muted); margin-bottom:12px; }
  .listing-list{ display:flex; flex-direction:column; gap:12px; }
  .listing-card{ display:flex; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px; }
  .listing-thumb{ width:84px; height:84px; border-radius:12px; flex-shrink:0; position:relative; overflow:hidden; background:linear-gradient(135deg,#8FA3D6,#3A4A78); }
  .listing-thumb img{ width:100%; height:100%; object-fit:cover; }
  .type-tag{ position:absolute; top:6px; left:6px; font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:3px 7px; border-radius:6px; background:rgba(255,255,255,0.95); color:var(--yellow-text); }
  .type-tag.shared{ color:#207364; }
  .listing-info{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:4px; }
  .listing-title{ font-size:13.5px; font-weight:600; }
  .listing-meta{ font-size:10.5px; color:var(--muted-2); }
  .badge-row{ display:flex; gap:8px; margin-top:1px; }
  .mini-badge{ display:flex; align-items:center; gap:3px; font-size:9.5px; color:var(--muted); font-weight:500; }
  .listing-price{ font-size:13.5px; color:var(--yellow-text); font-weight:700; margin-top:2px; }
  .listing-price span{ color:var(--muted-2); font-weight:500; font-size:10.5px; }
  .empty-note{ color:var(--muted-2); font-size:13px; text-align:center; padding:60px 0; }
</style>
</head>
<body>

    </a>
    <div class="search-bar">
