<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings — Rentshare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .wrap{ max-width:var(--max-width); margin:0 auto; padding:16px 20px 90px; }
  .top-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .back-btn{
    width:34px; height:34px; border-radius:10px; background:var(--surface);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; }

  .tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .tab-btn{
    flex:1; text-align:center; padding:11px 8px; border-radius:13px;
    background:var(--surface); border:1.5px solid var(--line); font-size:13px; font-weight:600; color:var(--muted);
    cursor:pointer;
  }
  .tab-btn.active{ background:#FDF1D9; border-color:var(--yellow); color:var(--yellow-text); }

  .booking-card{
    display:flex; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:12px; margin-bottom:12px;
  }
  .booking-thumb{ width:76px; height:76px; border-radius:12px; flex-shrink:0; overflow:hidden; background:linear-gradient(135deg,#8FA3D6,#3A4A78); }
  .booking-thumb img{ width:100%; height:100%; object-fit:cover; }
  .booking-info{ flex:1; min-width:0; }
  .booking-title{ font-size:13.5px; font-weight:600; margin-bottom:2px; }
  .booking-meta{ font-size:11.5px; color:var(--muted-2); margin-bottom:6px; }
  .booking-dates{ font-size:12px; color:var(--ink); font-weight:600; margin-bottom:6px; }
  .status-pill{ font-size:9.5px; font-weight:700; text-transform:uppercase; padding:3px 8px; border-radius:20px; display:inline-block; }
  .status-pill.requested{ background:rgba(242,177,52,0.15); color:var(--yellow-text); }
  .status-pill.confirmed, .status-pill.presence_confirmed, .status-pill.checked_in{ background:rgba(47,138,122,0.1); color:#1F6E5E; }
  .status-pill.completed{ background:rgba(23,32,58,0.08); color:var(--ink); }
  .status-pill.cancelled, .status-pill.flagged, .status-pill.disputed{ background:rgba(209,74,36,0.1); color:#B03A1A; }
  .status-pill.presence_unconfirmed{ background:rgba(209,74,36,0.08); color:#B03A1A; }

  .action-row{ display:flex; gap:8px; margin-top:8px; }
  .action-btn{
    flex:1; padding:8px; border-radius:10px; font-weight:700; font-size:11.5px; cursor:pointer;
    font-family:'Space Grotesk',sans-serif; border:none;
  }
  .action-btn.accept{ background:var(--teal); color:#fff; }
  .action-btn.decline{ background:transparent; border:1px solid var(--coral); color:var(--coral); }
  .action-btn:disabled{ opacity:0.6; }

  .empty-note{ color:var(--muted-2); font-size:13px; text-align:center; padding:60px 20px; }

  .presence-card{
    background:#FDF1D9; border:1.5px solid var(--yellow); border-radius:16px;
    padding:14px 16px; margin-bottom:16px;
  }
  .presence-card-title{ font-size:13px; font-weight:700; color:var(--yellow-text); margin-bottom:4px; }
  .presence-card-sub{ font-size:12px; color:var(--ink); margin-bottom:12px; line-height:1.4; }
  .presence-actions{ display:flex; gap:8px; }
  .presence-btn{
    flex:1; padding:10px; border-radius:10px; font-weight:700; font-size:12.5px; cursor:pointer;
    font-family:'Space Grotesk',sans-serif; border:none;
  }
  .presence-btn.same{ background:var(--teal); color:#fff; }
  .presence-btn.changed{ background:transparent; border:1px solid var(--coral); color:var(--coral); }

  .checkin-card{
    background:var(--surface); border:1.5px solid var(--teal); border-radius:16px;
    padding:14px 16px; margin-bottom:16px;
  }
  .checkin-card-title{ font-size:13px; font-weight:700; color:#1F6E5E; margin-bottom:4px; }
  .checkin-card-sub{ font-size:12px; color:var(--ink); margin-bottom:12px; line-height:1.4; }

  .safety-panel{
    background:rgba(209,74,36,0.06); border:1.5px solid var(--coral); border-radius:14px;
    padding:14px; margin-top:10px;
  }
  .safety-panel-title{ font-size:13px; font-weight:700; color:#B03A1A; margin-bottom:8px; }
  .safety-numbers{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .safety-number-row{
    display:flex; justify-content:space-between; align-items:center; background:#fff;
    border-radius:10px; padding:9px 12px; font-size:12.5px;
  }
  .safety-number-row a{ color:#B03A1A; font-weight:700; text-decoration:none; }
  .safety-panel-note{ font-size:11.5px; color:var(--muted); margin-bottom:12px; line-height:1.4; }
  .safety-confirm-btn{
    width:100%; background:var(--coral); color:#fff; border:none; border-radius:10px;
    padding:11px; font-weight:700; font-size:12.5px; cursor:pointer; font-family:'Space Grotesk',sans-serif;
  }
  .safety-cancel-link{
    display:block; text-align:center; margin-top:8px; font-size:11.5px; color:var(--muted); cursor:pointer;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-row">
    <a href="/" class="back-btn" aria-label="Back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>Bookings</h1>
  </div>

  <div id="presence-alert"></div>
  <div id="checkin-alert"></div>

  <div class="tabs">
    <div class="tab-btn active" data-view="guest">My Trips</div>
    <div class="tab-btn" data-view="host">Hosting</div>
  </div>

  <div id="content"><p class="empty-note">Loading…</p></div>
</div>

<script>
  const token = localStorage.getItem('rentshare_session');
  const content = document.getElementById('content');
  let data = { as_guest: [], as_host: [] };
  let currentView = 'guest';

  if (!token) {
    window.location.href = '/login.html';
  } else {
    loadBookings();
    loadPresencePending();
    loadCheckinPending();
  }

  async function loadCheckinPending() {
    const alertBox = document.getElementById('checkin-alert');
    try {
      const res = await fetch('/api/users/me/checkin-pending', { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) return;
      const data = await res.json();
      const pending = data.pending || [];

      if (pending.length === 0) {
        alertBox.innerHTML = '';
        return;
      }

      alertBox.innerHTML = pending.map((p) => `
        <div class="checkin-card" id="checkin-${p.booking_id}">
          <div class="checkin-card-title">Checking in — ${escapeHtml(p.listing_title)}</div>
          <div class="checkin-card-sub">Have you arrived, and does everything match what was listed?</div>
          <div class="presence-actions">
            <button class="presence-btn same" onclick="submitCheckin('${p.booking_id}', 'yes')">Yes, all good</button>
            <button class="presence-btn changed" onclick="showSafetyPanel('${p.booking_id}')">Something's different</button>
          </div>
          <div id="safety-panel-${p.booking_id}"></div>
        </div>
      `).join('');
    } catch (err) {
      // Silent — secondary panel, not worth breaking the whole page over.
    }
  }

  // Showing this panel does NOT submit anything yet — it only surfaces
  // real emergency contacts first, per the flow spec. Ending the stay
  // is a separate, deliberate confirm action below.
  function showSafetyPanel(bookingId) {
    document.getElementById(`safety-panel-${bookingId}`).innerHTML = `
      <div class="safety-panel">
        <div class="safety-panel-title">If you're in immediate danger, get help now</div>
        <div class="safety-numbers">
          <div class="safety-number-row"><span>Nigeria Emergency Line</span><a href="tel:112">Call 112</a></div>
          <div class="safety-number-row"><span>Police (NPF)</span><a href="tel:199">Call 199</a></div>
        </div>
        <div class="safety-panel-note">If you're safe but the space doesn't match what was listed, you can end this stay below. This flags your host's listing for review and applies a full refund.</div>
        <button class="safety-confirm-btn" onclick="submitCheckin('${bookingId}', 'no')">I'm safe — end my stay, this doesn't match</button>
        <div class="safety-cancel-link" onclick="hideSafetyPanel('${bookingId}')">Never mind, go back</div>
      </div>
    `;
  }

  function hideSafetyPanel(bookingId) {
    document.getElementById(`safety-panel-${bookingId}`).innerHTML = '';
  }

  async function submitCheckin(bookingId, response) {
    try {
      const res = await fetch('/api/checkin/respond', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ booking_id: bookingId, response }),
      });
      if (!res.ok) throw new Error('Failed');
      await loadCheckinPending();
      await loadBookings();
    } catch (err) {
      alert("Couldn't submit your response — try again.");
    }
  }

  async function loadPresencePending() {
    const alertBox = document.getElementById('presence-alert');
    try {
      const res = await fetch('/api/users/me/presence-pending', { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) return;
      const data = await res.json();
      const pending = data.pending || [];

      if (pending.length === 0) {
        alertBox.innerHTML = '';
        return;
      }

      alertBox.innerHTML = pending.map((p) => `
        <div class="presence-card">
          <div class="presence-card-title">Confirm who's home — ${escapeHtml(p.listing_title)}</div>
          <div class="presence-card-sub">A guest is checking in soon. Is the household still the same as what you listed?</div>
          <div class="presence-actions">
            <button class="presence-btn same" onclick="respondPresence('${p.presence_id}', 'same_as_listed')">Same as listed</button>
            <button class="presence-btn changed" onclick="respondPresence('${p.presence_id}', 'changed')">It's changed</button>
          </div>
        </div>
      `).join('');
    } catch (err) {
      // Silent — this is a secondary panel, not worth breaking the whole page over.
    }
  }

  async function respondPresence(presenceId, response) {
    if (response === 'changed') {
      const confirmed = confirm("This will flag the booking for review since the household no longer matches what's listed. Continue?");
      if (!confirmed) return;
    }
    try {
      const res = await fetch(`/api/presence/${presenceId}/respond`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ response }),
      });
      if (!res.ok) throw new Error('Failed');
      await loadPresencePending();
      await loadBookings();
    } catch (err) {
      alert("Couldn't submit your response — try again.");
    }
  }

  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.dataset.view;
      render();
    });
  });

  async function loadBookings() {
    try {
      const res = await fetch('/api/users/me/bookings', { headers: { Authorization: `Bearer ${token}` } });
      if (res.status === 401) {
        localStorage.removeItem('rentshare_session');
        window.location.href = '/login.html';
        return;
      }
      data = await res.json();
      render();
    } catch (err) {
      content.innerHTML = '<p class="empty-note">Couldn\'t load your bookings — try again.</p>';
    }
  }

  function render() {
    const list = currentView === 'guest' ? (data.as_guest || []) : (data.as_host || []);

    if (list.length === 0) {
      content.innerHTML = currentView === 'guest'
        ? `<p class="empty-note">No trips booked yet. <a href="/search.html" style="color:var(--yellow-text); font-weight:600;">Find a stay</a>.</p>`
        : `<p class="empty-note">No bookings received yet on your listings.</p>`;
      return;
    }

    content.innerHTML = list.map((b) => {
      let photos = [];
      try { photos = b.photos ? JSON.parse(b.photos) : []; } catch (e) {}
      const thumb = photos[0] ? `<img src="${photos[0]}" alt="">` : '';
      const showActions = currentView === 'host' && b.status === 'requested';

      return `
        <div class="booking-card">
          <a href="/listing.html?id=${b.listing_id}" style="text-decoration:none; color:inherit; display:flex; gap:12px; flex:1; min-width:0;">
            <div class="booking-thumb">${thumb}</div>
            <div class="booking-info">
              <div class="booking-title">${escapeHtml(b.title)}</div>
              <div class="booking-meta">${escapeHtml(b.area)}, ${escapeHtml(b.city)}</div>
              <div class="booking-dates">${formatDate(b.check_in_date)} → ${formatDate(b.check_out_date)}</div>
              <span class="status-pill ${b.status}">${b.status.replace(/_/g, ' ')}</span>
            </div>
          </a>
        </div>
        ${showActions ? `
          <div class="action-row" style="margin: -6px 0 12px;">
            <button class="action-btn accept" onclick="respondBooking('${b.id}', 'accept')">Accept</button>
            <button class="action-btn decline" onclick="respondBooking('${b.id}', 'decline')">Decline</button>
          </div>
        ` : ''}
      `;
    }).join('');
  }

  async function respondBooking(bookingId, action) {
    try {
      const res = await fetch(`/api/bookings/${bookingId}/${action}`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) throw new Error('Failed');
      await loadBookings();
    } catch (err) {
      alert("Couldn't update this booking — try again.");
    }
  }

  function formatDate(d) {
    if (!d) return '';
    const date = new Date(d);
    return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>

<footer class="tabbar" id="tabbar">
  <a href="/" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9.5V21h14V9.5"/></svg>
    Home
  </a>
  <a href="/search.html" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    Search
  </a>
  <a href="/bookings.html" class="tab active">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
    Bookings
  </a>
  <a href="/chats.html" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.5 8.5 0 0 1-3.8-.9L3 20l1-4.5A8.4 8.4 0 1 1 21 11.5Z"/></svg>
    Chats
  </a>
  <a href="/profile.html" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    Profile
  </a>
</footer>
</body>
</html>
