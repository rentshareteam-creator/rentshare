<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chats — Rentshare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .wrap{ max-width:var(--max-width); margin:0 auto; padding:16px 20px 90px; }
  .top-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .back-btn{
    width:34px; height:34px; border-radius:10px; background:var(--surface);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; }

  .convo-item{
    display:flex; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:13px 14px; margin-bottom:10px; text-decoration:none; color:inherit;
  }
  .convo-avatar{
    width:44px; height:44px; border-radius:50%; background:#FDF1D9; color:var(--yellow-text);
    display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:16px; flex-shrink:0; position:relative;
  }
  .unread-dot{
    position:absolute; top:-2px; right:-2px; width:16px; height:16px; border-radius:50%;
    background:var(--coral); color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--screen-bg);
  }
  .convo-body{ flex:1; min-width:0; }
  .convo-top{ display:flex; justify-content:space-between; gap:8px; }
  .convo-name{ font-size:13.5px; font-weight:700; }
  .convo-time{ font-size:10.5px; color:var(--muted-2); flex-shrink:0; }
  .convo-listing{ font-size:11px; color:var(--muted-2); margin-bottom:3px; }
  .convo-preview{ font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .convo-preview.unread{ color:var(--ink); font-weight:600; }

  .empty-note{ color:var(--muted-2); font-size:13px; text-align:center; padding:60px 20px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-row">
    <a href="/" class="back-btn" aria-label="Back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>Chats</h1>
  </div>

  <div id="content"><p class="empty-note">Loading…</p></div>
</div>

<script>
  const token = localStorage.getItem('rentshare_session');
  const content = document.getElementById('content');

  if (!token) {
    window.location.href = '/login.html';
  } else {
    loadConversations();
  }

  async function loadConversations() {
    try {
      const res = await fetch('/api/conversations', { headers: { Authorization: `Bearer ${token}` } });
      if (res.status === 401) {
        localStorage.removeItem('rentshare_session');
        window.location.href = '/login.html';
        return;
      }
      const data = await res.json();
      render(data.conversations || []);
    } catch (err) {
      content.innerHTML = '<p class="empty-note">Couldn\'t load your chats — try again.</p>';
    }
  }

  function render(conversations) {
    if (conversations.length === 0) {
      content.innerHTML = `<p class="empty-note">No conversations yet. Chats open automatically once you book a stay or receive a booking.</p>`;
      return;
    }

    content.innerHTML = conversations.map((c) => {
      const initial = c.other_party_name ? c.other_party_name.charAt(0).toUpperCase() : '?';
      const hasUnread = c.unread_count > 0;

      return `
        <a href="/chat.html?booking=${c.booking_id}" class="convo-item">
          <div class="convo-avatar">
            ${initial}
            ${hasUnread ? `<span class="unread-dot">${c.unread_count > 9 ? '9+' : c.unread_count}</span>` : ''}
          </div>
          <div class="convo-body">
            <div class="convo-top">
              <span class="convo-name">${escapeHtml(c.other_party_name || 'Unknown')}</span>
              <span class="convo-time">${c.last_message_at ? formatTime(c.last_message_at) : ''}</span>
            </div>
            <div class="convo-listing">${escapeHtml(c.listing_title)}</div>
            <div class="convo-preview ${hasUnread ? 'unread' : ''}">${c.last_message ? escapeHtml(c.last_message) : 'No messages yet — say hello'}</div>
          </div>
        </a>
      `;
    }).join('');
  }

  function formatTime(iso) {
    const date = new Date(iso);
    const now = new Date();
    const isToday = date.toDateString() === now.toDateString();
    return isToday
      ? date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
      : date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>
</body>
</html>
