<title>Listing — Rentshare</title>

  .wrap{ max-width:var(--max-width); margin:0 auto; padding-bottom:110px; }
  .back-btn{
    position:absolute; top:16px; left:16px; z-index:10;
    width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,0.92);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  .photo-hero{ position:relative; width:100%; height:280px; background:linear-gradient(135deg,#8FA3D6,#3A4A78); overflow:hidden; }
  .photo-hero img{ width:100%; height:100%; object-fit:cover; }
  .photo-strip{ display:flex; gap:6px; overflow-x:auto; padding:8px 20px; scrollbar-width:none; }
  .photo-strip::-webkit-scrollbar{ display:none; }
  .photo-strip img{ width:64px; height:64px; border-radius:10px; object-fit:cover; flex-shrink:0; cursor:pointer; border:2px solid transparent; }
  .photo-strip img.active{ border-color:var(--yellow); }

  .content{ padding:16px 20px 0; }
  .tag-row{ display:flex; gap:6px; margin-bottom:10px; }
  .tag{ font-size:10px; font-weight:700; text-transform:uppercase; padding:4px 9px; border-radius:6px; background:#FDF1D9; color:var(--yellow-text); }
  .tag.gender{ background:rgba(209,74,36,0.1); color:var(--coral); }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; margin-bottom:4px; }
  .location{ font-size:13px; color:var(--muted); margin-bottom:14px; }
  .price-line{ font-size:18px; font-weight:700; color:var(--yellow-text); font-family:'Space Grotesk',sans-serif; margin-bottom:18px; }
  .price-line span{ font-size:12.5px; color:var(--muted-2); font-weight:500; }

  .section-label{ font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:20px 0 10px; }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; }
  .detail-item{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 13px; }
  .detail-item .dl{ font-size:10.5px; color:var(--muted-2); margin-bottom:2px; }
  .detail-item .dv{ font-size:13px; font-weight:600; }

  .rules-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .rule-chip{ font-size:11.5px; font-weight:600; padding:7px 12px; border-radius:20px; background:var(--surface); border:1px solid var(--line); }
  .rule-chip.no{ color:var(--muted-2); text-decoration:line-through; opacity:0.6; }
  .rule-chip.yes{ color:#1F6E5E; background:rgba(47,138,122,0.08); border-color:rgba(47,138,122,0.25); }
