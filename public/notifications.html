<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Rentshare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .wrap{ max-width:var(--max-width); margin:0 auto; padding:16px 20px 90px; }
  .top-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .back-btn{
    width:34px; height:34px; border-radius:10px; background:var(--surface);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; }

  .notif-item{
    display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:13px 14px; margin-bottom:10px; text-decoration:none; color:inherit;
  }
  .notif-icon{
    width:38px; height:38px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .notif-icon.booking{ background:rgba(242,177,52,0.15); color:var(--yellow-text); }
  .notif-icon.presence{ background:rgba(242,177,52,0.15); color:var(--yellow-text); }
  .notif-icon.checkin{ background:rgba(47,138,122,0.1); color:#1F6E5E; }
  .notif-icon.checkout{ background:rgba(47,138,122,0.1); color:#1F6E5E; }
  .notif-icon.message{ background:rgba(63,167,150,0.12); color:#207364; }
  .notif-body{ flex:1; min-width:0; }
  .notif-title{ font-size:13.5px; font-weight:700; margin-bottom:2px; }
  .notif-sub{ font-size:12px; color:var(--muted); line-height:1.4; }

  .empty-note{ color:var(--muted-2); font-size:13px; text-align:center; padding:60px 20px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-row">
    <a href="/" class="back-btn" aria-label="Back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>Notifications</h1>
  </div>

  <div id="content"><p class="empty-note">Loading…</p></div>
</div>

<script>
  const token = localStorage.getItem('rentshare_session');
  const content = document.getElementById('content');

  if (!token) {
    window.location.href = '/login.html';
  } else {
    loadNotifications();
  }

  async function loadNotifications() {
    try {
      const headers = { Authorization: `Bearer ${token}` };
      const [bookingsRes, presenceRes, checkinRes, checkoutRes, conversationsRes] = await Promise.all([
        fetch('/api/users/me/bookings', { headers }),
        fetch('/api/users/me/presence-pending', { headers }),
        fetch('/api/users/me/checkin-pending', { headers }),
        fetch('/api/users/me/checkout-pending', { headers }),
        fetch('/api/conversations', { headers }),
      ]);

      if (bookingsRes.status === 401) {
        localStorage.removeItem('rentshare_session');
        window.location.href = '/login.html';
        return;
      }

      const bookingsData = await bookingsRes.json();
      const presenceData = await presenceRes.json();
      const checkinData = await checkinRes.json();
      const checkoutData = await checkoutRes.json();
      const conversationsData = await conversationsRes.json();

      const items = [];

      (bookingsData.as_host || []).filter((b) => b.status === 'requested').forEach((b) => {
        items.push({
          type: 'booking',
          title: 'New booking request',
          sub: `${b.title} — ${formatDate(b.check_in_date)} to ${formatDate(b.check_out_date)}`,
          href: '/bookings.html',
        });
      });

      (presenceData.pending || []).forEach((p) => {
        items.push({
          type: 'presence',
          title: 'Confirm who\'s home',
          sub: p.listing_title,
          href: '/bookings.html',
        });
      });

      (checkinData.pending || []).forEach((c) => {
        items.push({
          type: 'checkin',
          title: 'Check-in confirmation needed',
          sub: c.listing_title,
          href: '/bookings.html',
        });
      });

      (checkoutData.pending || []).forEach((c) => {
        items.push({
          type: 'checkout',
          title: 'Checkout confirmation needed',
          sub: c.listing_title,
          href: '/bookings.html',
        });
      });

      (conversationsData.conversations || []).filter((c) => c.unread_count > 0).forEach((c) => {
        items.push({
          type: 'message',
          title: `New message from ${c.other_party_name || 'someone'}`,
          sub: c.last_message || c.listing_title,
          href: `/chat.html?booking=${c.booking_id}`,
        });
      });

      render(items);
    } catch (err) {
      content.innerHTML = '<p class="empty-note">Couldn\'t load notifications — try again.</p>';
    }
  }

  const ICONS = {
    booking: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>',
    presence: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7"/><path d="M5 9.5V21h14V9.5"/></svg>',
    checkin: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9 8 11 4.6-2 8-6 8-11V5Z"/><path d="m9 12 2 2 4-4"/></svg>',
    checkout: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9 8 11 4.6-2 8-6 8-11V5Z"/><path d="m9 12 2 2 4-4"/></svg>',
    message: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.5 8.5 0 0 1-3.8-.9L3 20l1-4.5A8.4 8.4 0 1 1 21 11.5Z"/></svg>',
  };

  function render(items) {
    if (items.length === 0) {
      content.innerHTML = '<p class="empty-note">You\'re all caught up — nothing needs your attention.</p>';
      return;
    }

    content.innerHTML = items.map((item) => `
      <a href="${item.href}" class="notif-item">
        <div class="notif-icon ${item.type}">${ICONS[item.type]}</div>
        <div class="notif-body">
          <div class="notif-title">${escapeHtml(item.title)}</div>
          <div class="notif-sub">${escapeHtml(item.sub)}</div>
        </div>
      </a>
    `).join('');
  }

  function formatDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>

<footer class="tabbar" id="tabbar">
  <a href="/" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9.5V21h14V9.5"/></svg>
    Home
  </a>
  <a href="/search.html" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    Search
  </a>
  <a href="/bookings.html" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
    Bookings
  </a>
  <a href="/chats.html" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.5 8.5 0 0 1-3.8-.9L3 20l1-4.5A8.4 8.4 0 1 1 21 11.5Z"/></svg>
    Chats
  </a>
  <a href="/profile.html" class="tab">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    Profile
  </a>
</footer>
</body>
</html>
